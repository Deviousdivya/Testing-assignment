{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Data Portal</title>
  <link rel="stylesheet" href="{% static 'employees/styles.css' %}">
</head>
<body>
  <main class="shell">
    <header class="toolbar">
      <div>
        <h1>Employee Data Portal</h1>
        <p>Search, filter, page, and export large employee datasets.</p>
      </div>
      <div class="exports">
        <button data-export="csv">CSV</button>
        <button data-export="xlsx">Excel</button>
        <button data-export="pdf">PDF</button>
      </div>
    </header>

    <section class="filters">
      <label>
        Search
        <input id="search" type="search" placeholder="Name, email, department">
      </label>
      <label>
        Joined From
        <input id="joined_from" type="date">
      </label>
      <label>
        Joined To
        <input id="joined_to" type="date">
      </label>
      <label>
        Page Size
        <select id="page_size">
          <option>25</option>
          <option selected>50</option>
          <option>100</option>
          <option>250</option>
        </select>
      </label>
    </section>

    <section class="table-panel">
      <div class="table-status">
        <span id="resultCount">Loading employees...</span>
        <span id="pageInfo"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Position</th>
              <th>Joined</th>
              <th>Salary</th>
            </tr>
          </thead>
          <tbody id="employeeRows"></tbody>
        </table>
      </div>
      <nav class="pagination">
        <button id="prevPage">Previous</button>
        <button id="nextPage">Next</button>
      </nav>
    </section>
  </main>
  <script src="{% static 'employees/app.js' %}"></script>
</body>
</html>
